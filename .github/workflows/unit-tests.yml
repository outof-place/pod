name: Unit tests

on:
  workflow_call:
    inputs:
      node_versions:
        description: JSON array of Node.js major versions to test.
        required: true
        type: string

      runner:
        description: Hosted runner for the unit shards.
        required: false
        default: ubuntu-latest
        type: string

      shards:
        description: JSON array of shard assignments, produced by unit-plan.yml.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: tests node ${{ matrix.node }} ${{ matrix.shard.index }}/${{ matrix.shard.count }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node_versions) }}
        shard: ${{ fromJSON(inputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: ${{ matrix.node }}
          cache-electron-package: 'true'

      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unit-selection-attempt-${{ github.run_attempt }}
          path: ci-shards/

      - name: Test shard
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          export ORCA_SHARD_SOURCE_SHA
          node config/scripts/run-vitest.mjs run --config config/vitest.config.ts \
            --shard=${{ matrix.shard.index }}/${{ matrix.shard.count }} \
            ${{ inputs.runner == 'ubuntu-24.04-arm' && '--maxWorkers=4' || '' }}

      - name: Upload unit shard assignment
        if: always()
        # Diagnostic upload outages must not change the test verdict.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-node-${{ matrix.node }}-${{ matrix.shard.index }}-attempt-${{ github.run_attempt }}
          path: ci-shards/
          retention-days: 14
          if-no-files-found: warn
