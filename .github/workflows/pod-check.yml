# Runs Pod's checks on main or a candidate branch (stack/cand-*): the generated-layer check, the
# typecheck and the unit tests, one after another in one job on Pod's own runner (labels pod-ci, an
# isolated OrbStack VM without the Mac's files), so a run costs no GitHub minutes. The macOS build is
# not here: it runs locally before a release. Nothing else: no rebase, no pull request, no issue, and
# nothing from Orca.
#
#   gh workflow run pod-check.yml -R outof-place/pod -f ref=stack/cand-<n>
#
# GITHUB_TOKEN reads the repository. POD_PAYLOAD_TOKEN (read access to claude-acc's contents) is a
# repository secret that fetches the claude-acc payload once that repository is private. Every run
# gets it, so the allowlist below is only this copy's: a branch's own copy of this file, dispatched by
# someone with write access, could drop it and run that branch's code on the runner with the token.
name: Pod check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: main or a candidate branch (stack/cand-*).
        required: false
        type: string
        default: main

permissions:
  contents: read

# One run at a time on the one runner: a newer dispatch replaces a pending one.
concurrency:
  group: pod-check
  cancel-in-progress: false

env:
  UNIT_SHARDS: '5'

jobs:
  check:
    name: Pod check
    runs-on: [self-hosted, linux, ARM64, pod-ci]
    timeout-minutes: 150
    steps:
      # Why only these: a branch is checked once it is a candidate.
      - name: Only main and candidates
        env:
          CHECK_REF: ${{ inputs.ref }}
        run: |
          case "$CHECK_REF" in
            main | stack/cand-*) ;;
            *)
              echo "::error::pod-check runs on main and stack/cand-* candidates, not $CHECK_REF"
              exit 1
              ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Record the commit
        env:
          CHECK_REF: ${{ inputs.ref }}
        run: echo "Checking $CHECK_REF at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      # Commits land on main after the generated layers, so they must leave every codemod current.
      - name: Generated layers are current
        run: bash scripts/pod-generated.sh --check
      - run: pnpm tc
      - run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      # The product packaging tests load the release config, which ships this pinned payload.
      - name: Fetch the claude-acc payload
        env:
          POD_PAYLOAD_TOKEN: ${{ secrets.POD_PAYLOAD_TOKEN }}
        run: |
          if [ -f config/scripts/fetch-claude-acc-payload.mjs ]; then
            node config/scripts/fetch-claude-acc-payload.mjs
          fi
      # The hosted check's five shards, one after another: the same balanced file lists.
      # ORCA_BALANCE_UNIT_SHARDS selects them, which leaves out the cross-version harness and the
      # live-shell tests. One retry: a few grammar-loading tests time out under full-suite load; the
      # retry reporter lists every retried test in the summary. A --reporter replaces the config's
      # reporters, so the timing reporter is named again.
      - name: Unit tests
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: |
          ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          export ORCA_SHARD_SOURCE_SHA
          failed=0
          for shard in $(seq 1 "$UNIT_SHARDS"); do
            echo "::group::Unit tests $shard/$UNIT_SHARDS"
            node config/scripts/run-vitest.mjs run --config config/vitest.config.ts \
              "--shard=$shard/$UNIT_SHARDS" --maxWorkers=4 --retry=1 --reporter=default \
              "--reporter=$PWD/config/scripts/ci-unit-timing-reporter.mjs" \
              "--reporter=$PWD/config/scripts/ci-unit-retry-summary-reporter.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
