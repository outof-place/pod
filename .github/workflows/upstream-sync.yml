# Rebases Pod's product branch (`main`) onto the newest green commit of Orca's main.
#
# Daily (and on demand): fast-forward `orca-main` to Orca's main, pick the newest Orca main commit
# whose GitHub Actions checks all passed (scripts/pod-orca-base.sh green), and if it is newer than
# the one upstream.json pins, rebase `main` onto it in `sync/orca-main`. Then run typecheck, unit
# tests and the macOS build, and open or refresh the one "Rebase on Orca main" pull request. A
# conflict or a failed check opens or updates ONE issue labelled `upstream-sync` instead; the next
# successful sync closes it. Run it with `promote` to move `main` to the reviewed sync branch.
# Every push it makes is followed by scripts/pod-workflow-quarantine.sh, which keeps Orca's
# workflows disabled.
#
# Requires the POD_SYNC_TOKEN repository secret. GITHUB_TOKEN cannot push commits that touch
# .github/workflows, and Orca's main changes them constantly. Use a fine-grained token scoped to
# outof-place/pod with Contents, Pull requests, Issues and Workflows set to read and write, or a
# classic token with the `repo` and `workflow` scopes. See CONTRIBUTING.md.
name: Upstream sync

on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Orca commit or ref to rebase on (default is the newest green commit on Orca main). Setting it also re-runs a sync that already has an open PR or issue.
        required: false
        type: string
      promote:
        description: Instead of syncing, move main to the reviewed "Rebase on Orca main" pull request.
        required: false
        type: boolean
        default: false
      check:
        description: Instead of syncing, only run the checks on this branch or commit (no rebase, PR or issue).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: stablyai/orca
  PRODUCT_BRANCH: main
  MIRROR_BRANCH: orca-main
  SYNC_BRANCH: sync/orca-main
  ISSUE_LABEL: upstream-sync
  UNIT_SHARDS: '5'

jobs:
  mirror:
    name: Mirror Orca main into orca-main
    if: ${{ !inputs.promote && !inputs.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout the quarantine script
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          sparse-checkout: scripts/pod-workflow-quarantine.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Keep Orca workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pod-workflow-quarantine.sh

      - name: Fast-forward orca-main
        env:
          GH_TOKEN: ${{ secrets.POD_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::POD_SYNC_TOKEN is not set. See CONTRIBUTING.md, section 'Maintainers: the sync token'."
            exit 1
          fi
          upstream=$(gh api "repos/$UPSTREAM_REPO/branches/main" --jq .commit.sha)
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/$MIRROR_BRANCH" --jq .commit.sha 2>/dev/null || true)
          # The fork shares Orca's objects, so the ref can point at a commit only Orca has pushed.
          if [ -z "$current" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$MIRROR_BRANCH" -f "sha=$upstream" >/dev/null
          elif [ "$current" != "$upstream" ]; then
            # force=false: a stray commit on orca-main makes this fail instead of being overwritten.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$MIRROR_BRANCH" -f "sha=$upstream" -F force=false >/dev/null
          fi
          echo "$MIRROR_BRANCH is at $upstream" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Orca workflows disabled after the push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          bash scripts/pod-workflow-quarantine.sh

  detect:
    name: Find a newer green Orca commit
    if: ${{ !inputs.promote && !inputs.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      old_sha: ${{ steps.plan.outputs.old_sha }}
      new_sha: ${{ steps.plan.outputs.new_sha }}
      pod_sha: ${{ steps.plan.outputs.pod_sha }}
    steps:
      - name: Require the sync token
        env:
          POD_SYNC_TOKEN: ${{ secrets.POD_SYNC_TOKEN }}
        run: |
          if [ -z "$POD_SYNC_TOKEN" ]; then
            echo "::error::POD_SYNC_TOKEN is not set. See CONTRIBUTING.md, section 'Maintainers: the sync token'."
            exit 1
          fi

      - name: Checkout upstream.json and the base script
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          sparse-checkout: |
            upstream.json
            scripts/pod-orca-base.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.POD_SYNC_TOKEN }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          old_sha=$(jq -er '.ref // .sha' upstream.json)
          pod_sha=$(git rev-parse HEAD)

          if [ -n "$REQUESTED_REF" ]; then
            new_sha=$(gh api "repos/$UPSTREAM_REPO/commits/$REQUESTED_REF" --jq .sha)
          else
            new_sha=$(bash scripts/pod-orca-base.sh green "$UPSTREAM_REPO" main)
          fi

          needed=true
          if [ "$new_sha" = "$old_sha" ]; then
            needed=false
            echo "Pod is already on Orca $new_sha."
          elif [ -z "$REQUESTED_REF" ]; then
            # "ahead" means the pinned commit is already past the newest green one.
            if [ "$(gh api "repos/$UPSTREAM_REPO/compare/$new_sha...$old_sha" --jq .status)" = ahead ]; then
              needed=false
              echo "Pod's base $old_sha is newer than the newest green commit $new_sha."
            fi
            pr_body=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open \
              --limit 1 --json body --jq '.[0].body // ""')
            if [ "$needed" = true ] && printf '%s' "$pr_body" | grep -qF -- "base=$pod_sha head=" &&
              printf '%s' "$pr_body" | grep -qF -- "orca=$new_sha"; then
              needed=false
              echo "The open sync pull request already rebases $pod_sha onto $new_sha."
            fi
            # A known failure for this exact Orca commit and Pod commit would only fail again.
            issue_body=$(gh issue list -R "$GITHUB_REPOSITORY" --label "$ISSUE_LABEL" --state open \
              --limit 1 --json body --jq '.[0].body // ""')
            if [ "$needed" = true ] && printf '%s' "$issue_body" | grep -qF -- "<!-- upstream-sync orca=$new_sha pod=$pod_sha -->"; then
              needed=false
              echo "The open $ISSUE_LABEL issue already covers $new_sha on $PRODUCT_BRANCH $pod_sha."
            fi
          fi

          {
            echo "needed=$needed"
            echo "old_sha=$old_sha"
            echo "new_sha=$new_sha"
            echo "pod_sha=$pod_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: Orca $old_sha -> $new_sha, needed=$needed" >> "$GITHUB_STEP_SUMMARY"

  rebase:
    name: Rebase main
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    outputs:
      result: ${{ steps.rebase.outputs.result }}
      label: ${{ steps.rebase.outputs.label }}
      old_label: ${{ steps.rebase.outputs.old_label }}
      nearest_tag: ${{ steps.rebase.outputs.nearest_tag }}
      head_sha: ${{ steps.push.outputs.head_sha }}
    env:
      OLD_SHA: ${{ needs.detect.outputs.old_sha }}
      NEW_SHA: ${{ needs.detect.outputs.new_sha }}
      POD_SHA: ${{ needs.detect.outputs.pod_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.pod_sha }}
          fetch-depth: 0
          token: ${{ secrets.POD_SYNC_TOKEN }}

      - name: Fetch Orca main and its release tags
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          # Orca's tags go to a private namespace so Pod's own tags never count as Orca's.
          git fetch --no-tags upstream "+refs/heads/main:refs/remotes/upstream/main" \
            "+refs/tags/v*:refs/pod-stack/orca-tags/v*"
          if ! git cat-file -e "$NEW_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags upstream "$NEW_SHA"
          fi
          if ! git merge-base --is-ancestor "$OLD_SHA" HEAD; then
            echo "::error::$PRODUCT_BRANCH is not built on $OLD_SHA, the commit upstream.json pins. Fix upstream.json first."
            exit 1
          fi

      - name: Rebase onto the new base
        id: rebase
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$SYNC_BRANCH"
          mkdir -p "$RUNNER_TEMP/sync"
          report="$RUNNER_TEMP/sync/report.md"
          {
            echo "label=$(bash scripts/pod-orca-base.sh describe "$NEW_SHA")"
            echo "old_label=$(bash scripts/pod-orca-base.sh describe "$OLD_SHA")"
          } >> "$GITHUB_OUTPUT"

          record_conflict() {
            local stage=$1 stopped files
            stopped=$(git rev-parse --verify -q REBASE_HEAD || true)
            files=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            {
              echo "**Stage:** $stage"
              echo
              if [ -n "$stopped" ]; then
                echo "**Stopped at:** \`$(git log -1 --format='%h %s' "$stopped")\`"
                trailer=$(git log -1 --format='%(trailers:key=Upstream,key=Fork-only,separator=%x3B )' "$stopped")
                [ -n "$trailer" ] && echo "**Trailer:** $trailer"
                echo
              fi
              echo "**Conflicted files:**"
              echo
              echo '```'
              echo "${files:-(none reported)}"
              echo '```'
            } > "$report"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          }

          git rebase --onto "$NEW_SHA" "$OLD_SHA" || record_conflict "rebase --onto ${NEW_SHA:0:10}"

          # Fold the new pin into the commit that owns upstream.json, so the stack stays one commit per change.
          if ! bash scripts/pod-orca-base.sh pin "$NEW_SHA" > "$RUNNER_TEMP/upstream.json"; then
            echo "::error::Could not compute the upstream.json pin for $NEW_SHA."
            exit 1
          fi
          echo "nearest_tag=$(jq -r .nearestTag "$RUNNER_TEMP/upstream.json")" >> "$GITHUB_OUTPUT"
          mv "$RUNNER_TEMP/upstream.json" upstream.json
          git add upstream.json
          pin_commit=$(git log -1 --format=%H "$NEW_SHA..HEAD" -- upstream.json)
          if [ -n "$pin_commit" ]; then
            git commit --quiet --fixup="$pin_commit"
            GIT_SEQUENCE_EDITOR=: git rebase --quiet -i --autosquash "$NEW_SHA" || record_conflict "autosquash of the upstream.json pin"
          else
            git commit --quiet -m "build(pod): pin the Orca base commit in upstream.json" \
              -m "Fork-only: Orca base pin read by CI and the release notes"
          fi

          git range-diff --no-color "$OLD_SHA..$POD_SHA" "$NEW_SHA..HEAD" > "$RUNNER_TEMP/sync/range-diff.txt" || true
          echo "result=clean" >> "$GITHUB_OUTPUT"

      - name: Push the sync branch
        id: push
        if: steps.rebase.outputs.result == 'clean'
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep Orca workflows disabled after the push
        if: steps.rebase.outputs.result == 'clean'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          bash scripts/pod-workflow-quarantine.sh

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-report
          path: ${{ runner.temp }}/sync/
          if-no-files-found: ignore

  target:
    name: Resolve the ref to check
    if: ${{ inputs.check != '' && !inputs.promote }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.resolve.outputs.result }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_REF: ${{ inputs.check }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECK_REF" --jq .sha)
          echo "Checking $CHECK_REF at $sha" >> "$GITHUB_STEP_SUMMARY"
          { echo "head_sha=$sha"; echo "result=clean"; } >> "$GITHUB_OUTPUT"

  typecheck:
    name: Typecheck
    needs: [rebase, target]
    if: ${{ !cancelled() && (needs.rebase.outputs.result == 'clean' || needs.target.outputs.result == 'clean') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.head_sha || needs.target.outputs.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - run: pnpm tc

  unit:
    name: Unit tests ${{ matrix.shard }}
    needs: [rebase, target]
    if: ${{ !cancelled() && (needs.rebase.outputs.result == 'clean' || needs.target.outputs.result == 'clean') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.head_sha || needs.target.outputs.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      - run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      # ORCA_BALANCE_UNIT_SHARDS selects Orca's CI file list, which leaves out the cross-version
      # harness (its own job below) and the live-shell tests Orca runs elsewhere.
      # One retry: a few grammar-loading tests time out under full-suite load.
      - name: Test shard
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: |
          ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          export ORCA_SHARD_SOURCE_SHA
          node config/scripts/run-vitest.mjs run --config config/vitest.config.ts \
            "--shard=${{ matrix.shard }}/$UNIT_SHARDS" --maxWorkers=4 --retry=1

  cross_version:
    name: Cross-version wire compatibility
    needs: [rebase, target]
    if: ${{ !cancelled() && (needs.rebase.outputs.result == 'clean' || needs.target.outputs.result == 'clean') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    outputs:
      journeys: ${{ steps.journeys.outcome }}
    steps:
      # Full history without historical blobs: the harness checks out old releases by tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.head_sha || needs.target.outputs.head_sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Fetch Orca's release tags
        run: |
          git fetch --no-tags --filter=blob:none "https://github.com/$UPSTREAM_REPO.git" \
            '+refs/tags/v*:refs/tags/v*'
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - name: Daemon protocol crossing against the newest release
        run: pnpm run check:daemon-protocol-crossing
      # Advisory: Orca runs these only on pull requests that touch wire code, so Orca's main is
      # sometimes red here on its own. The result goes into the pull request body.
      - name: Old and new client and server journeys
        id: journeys
        continue-on-error: true
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: pnpm exec vitest run --config config/vitest.config.ts tests/e2e/cross-version-wire/

  build:
    name: macOS build
    needs: [rebase, target]
    if: ${{ !cancelled() && (needs.rebase.outputs.result == 'clean' || needs.target.outputs.result == 'clean') }}
    # The free 3-core macos-15 may run short of memory on `pnpm build`; POD_MAC_RUNNER switches it (CONTRIBUTING.md).
    runs-on: ${{ vars.POD_MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.rebase.outputs.head_sha || needs.target.outputs.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Build
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: pnpm build

  report:
    name: Open the PR or the issue
    needs: [detect, rebase, typecheck, unit, cross_version, build]
    if: always() && needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.POD_SYNC_TOKEN }}
      OLD_SHA: ${{ needs.detect.outputs.old_sha }}
      NEW_SHA: ${{ needs.detect.outputs.new_sha }}
      POD_SHA: ${{ needs.detect.outputs.pod_sha }}
      LABEL: ${{ needs.rebase.outputs.label }}
      OLD_LABEL: ${{ needs.rebase.outputs.old_label }}
      NEAREST_TAG: ${{ needs.rebase.outputs.nearest_tag }}
      HEAD_SHA: ${{ needs.rebase.outputs.head_sha }}
      REBASE_JOB: ${{ needs.rebase.result }}
      REBASE_RESULT: ${{ needs.rebase.outputs.result }}
      CHECKS: typecheck=${{ needs.typecheck.result }} unit=${{ needs.unit.result }} cross-version=${{ needs.cross_version.result }} build=${{ needs.build.result }}
      JOURNEYS: ${{ needs.cross_version.outputs.journeys }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the quarantine script
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.pod_sha }}
          sparse-checkout: scripts/pod-workflow-quarantine.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the sync report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: upstream-sync-report
          path: sync

      - name: Open the PR or the issue
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          short=${NEW_SHA:0:10}
          title="Rebase on Orca main $short (${LABEL:-$short})"
          compare="https://github.com/$UPSTREAM_REPO/compare/$OLD_SHA...$NEW_SHA"
          open_issue=$(gh issue list -R "$repo" --label "$ISSUE_LABEL" --state open --limit 1 --json number --jq '.[0].number // ""')

          if [ "$REBASE_RESULT" = clean ] && [ "$CHECKS" = "typecheck=success unit=success cross-version=success build=success" ]; then
            {
              echo "<!-- upstream-sync promote base=$POD_SHA head=$HEAD_SHA orca=$NEW_SHA -->"
              echo "Rebases \`$PRODUCT_BRANCH\` from Orca ${OLD_LABEL:-$OLD_SHA} to Orca main [\`$short\`](https://github.com/$UPSTREAM_REPO/commit/$NEW_SHA) ($LABEL), the newest commit whose Orca checks all passed."
              echo
              echo "- Orca changes in this range: $compare"
              echo "- Typecheck, unit tests ($UNIT_SHARDS shards), the daemon protocol crossing and the macOS build passed: $RUN_URL"
              if [ "$JOURNEYS" = success ]; then
                echo "- Cross-version wire journeys passed."
              else
                echo "- **Cross-version wire journeys failed (advisory).** Orca's main is sometimes red there on its own; check whether the failing files involve Pod's changes before promoting."
              fi
              echo "- \`upstream.json\` now pins \`$NEW_SHA\`; release notes say \"Based on Orca $NEAREST_TAG\"."
              echo
              echo "**Do not press Merge.** A rebase replaces the branch. To promote it, run the sync with \`promote\`:"
              echo
              echo '```sh'
              echo "gh workflow run upstream-sync.yml -R $repo -f promote=true"
              echo '```'
              echo
              echo "It moves \`$PRODUCT_BRANCH\` from \`$POD_SHA\` to \`$HEAD_SHA\` with a lease, keeps Orca's workflows disabled, and GitHub then shows this pull request as merged. A later sync refreshes this same pull request."
              if [ -s sync/range-diff.txt ]; then
                echo
                echo "<details><summary>Range diff of the Pod stack (old base vs new base)</summary>"
                echo
                echo '```'
                head -c 50000 sync/range-diff.txt
                echo '```'
                echo "</details>"
              fi
            } > pr-body.md
            existing=$(gh pr list -R "$repo" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // ""')
            if [ -n "$existing" ]; then
              gh pr edit "$existing" -R "$repo" --title "$title" --body-file pr-body.md
              pr_url=$(gh pr view "$existing" -R "$repo" --json url --jq .url)
            else
              pr_url=$(gh pr create -R "$repo" --base "$PRODUCT_BRANCH" --head "$SYNC_BRANCH" \
                --title "$title" --body-file pr-body.md)
            fi
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" -R "$repo" --comment "Orca main $short synced cleanly: $pr_url"
            fi
            echo "Opened $pr_url" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$REBASE_RESULT" = conflict ]; then
            headline="Pod does not rebase cleanly on Orca main $short."
          elif [ "$REBASE_RESULT" = clean ]; then
            headline="Pod rebases on Orca main $short, but checks failed ($CHECKS)."
          else
            headline="The sync job failed before it could rebase (rebase job: $REBASE_JOB)."
          fi
          {
            echo "<!-- upstream-sync orca=$NEW_SHA pod=$POD_SHA -->"
            echo "$headline"
            echo
            echo "- Current base: Orca \`$OLD_SHA\`${OLD_LABEL:+ ($OLD_LABEL)}, \`$PRODUCT_BRANCH\` at \`$POD_SHA\`"
            echo "- Target: Orca main [\`$short\`](https://github.com/$UPSTREAM_REPO/commit/$NEW_SHA)${LABEL:+ ($LABEL)}, changes: $compare"
            [ -n "$HEAD_SHA" ] && echo "- Rebased stack: branch \`$SYNC_BRANCH\` at \`$HEAD_SHA\`"
            echo "- Run: $RUN_URL"
            echo
            [ -s sync/report.md ] && cat sync/report.md && echo
            echo "**To fix by hand:**"
            echo
            echo '```sh'
            echo "git fetch origin && git fetch upstream main"
            echo "git switch -c fix-sync origin/$PRODUCT_BRANCH"
            echo "git rebase --onto $NEW_SHA $OLD_SHA   # resolve, then rewrite upstream.json with scripts/pod-orca-base.sh pin"
            echo '```'
            echo
            echo "Or fix the offending topic branch and rebuild the stack: \`scripts/pod-stack.sh --onto $NEW_SHA\`."
            echo
            echo "This is the only \`$ISSUE_LABEL\` issue: later runs update it instead of opening another, and the next clean sync closes it."
          } > issue-body.md

          gh label create "$ISSUE_LABEL" -R "$repo" --color B60205 \
            --description "Automatic rebase on Orca main needs a human" 2>/dev/null || true
          if [ -n "$open_issue" ]; then
            gh issue edit "$open_issue" -R "$repo" --title "Upstream sync: Orca main $short needs a hand" --body-file issue-body.md
            gh issue comment "$open_issue" -R "$repo" --body "$headline $RUN_URL"
          else
            gh issue create -R "$repo" --label "$ISSUE_LABEL" \
              --title "Upstream sync: Orca main $short needs a hand" --body-file issue-body.md
          fi
          echo "$headline" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Orca workflows disabled after the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          bash scripts/pod-workflow-quarantine.sh

  promote:
    name: Promote the sync pull request to main
    if: ${{ inputs.promote }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Find the reviewed sync
        id: find
        env:
          GH_TOKEN: ${{ secrets.POD_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::POD_SYNC_TOKEN is not set. See CONTRIBUTING.md, section 'Maintainers: the sync token'."
            exit 1
          fi
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base "$PRODUCT_BRANCH" --state open \
            --json number,headRefOid,body --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::No open sync pull request from $SYNC_BRANCH."
            exit 1
          fi
          marker=$(printf '%s' "$pr" | jq -r '.body' | grep -oE 'upstream-sync promote base=[0-9a-f]{40} head=[0-9a-f]{40}' || true)
          base=$(printf '%s' "$marker" | sed -E 's/.*base=([0-9a-f]{40}).*/\1/')
          head=$(printf '%s' "$marker" | sed -E 's/.*head=([0-9a-f]{40}).*/\1/')
          if [ -z "$marker" ] || [ "$head" != "$(printf '%s' "$pr" | jq -r '.headRefOid')" ]; then
            echo "::error::$SYNC_BRANCH changed after its checks passed; run the sync again."
            exit 1
          fi
          {
            echo "base=$base"
            echo "head=$head"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the sync branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.find.outputs.head }}
          token: ${{ secrets.POD_SYNC_TOKEN }}

      - name: Move main with a lease
        env:
          BASE: ${{ steps.find.outputs.base }}
          HEAD: ${{ steps.find.outputs.head }}
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$BASE" origin "$HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "$PRODUCT_BRANCH moved from $BASE to $HEAD" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep Orca workflows disabled after the push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          bash scripts/pod-workflow-quarantine.sh
