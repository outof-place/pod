# Builds the orcad deployment template (design D2) that the Pod release ships in
# Contents/Resources/orcad-template: SSH relays and managed orcad deploys materialize a remote
# host's slot from it. Pod deploys to darwin and to glibc and musl Linux, on x64 and arm64; no
# win32 (windowsSshHosts, src/shared/product/features.ts). Each lane builds and smokes its node-pty
# slot under the pinned Node, and the template job merges the six and uploads `pod-orcad-template`:
# orcad-template/, orcad-template.source (`pod <commit>`, `run <id>`) and orcad-template.SHA256SUMS.
#
#   gh workflow run pod-orcad-template.yml -R outof-place/pod --ref <main | stack/cand-<n> | v<version>>
#
# It builds the dispatched commit, so the run's headSha is the template's commit: dispatch it while
# the ref points at the commit a release or test build packs, which takes it with
# product/scripts/fetch-orcad-template.sh. GITHUB_TOKEN only reads the repository.
name: pod-orcad-template

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pod-orcad-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Check the ref
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Check the ref
        id: ref
        run: |
          set -euo pipefail
          # Why only these: the template ships in builds of main, a candidate or a release tag.
          ref_pattern='^(refs/heads/main|refs/heads/stack/cand-[0-9A-Za-z._-]+|refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$'
          if [[ ! "$GITHUB_REF" =~ $ref_pattern ]]; then
            echo "::error::pod-orcad-template builds main, stack/cand-* or a v<semver> tag, not $GITHUB_REF"
            exit 1
          fi
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GITHUB_SHA is not a commit"; exit 1; }
          echo "Building $GITHUB_REF at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  glibc:
    name: Slot ${{ matrix.slot }}
    needs: target
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Design D6: glibc slots are built and gated on glibc 2.28, the pinned Node's own floor.
        # gcc-toolset-14 supplies C++20 and links newer libstdc++ symbols statically.
        include:
          - os: ubuntu-24.04
            slot: linux-x64-glibc
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:407f771c51a2c3e83ebe5a7970b4289ead3a6db21d9b9c089168775cad11d328
          - os: ubuntu-24.04-arm
            slot: linux-arm64-glibc
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:c22ffd129ac99a8a42d1f2c2f4e88a9089288dd9ee987a7092da1c7dc48f27a9
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      # The image puts /opt/clang first on PATH; the slot is built with its gcc-toolset.
      CC: gcc
      CXX: g++
      PYTHON: /opt/python/cp312-cp312/bin/python3
      SLOT: ${{ matrix.slot }}
      HEAD_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - name: Install glibc 2.28 prerequisites
        run: |
          missing_tool=false
          for tool in git ps unzip which xz; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tool=true
            fi
          done
          if [ "$missing_tool" = true ]; then
            # The image's source-built Git needs no RPM; missing tools come from AlmaLinux.
            dnf --disablerepo='epel*' install -y git procps-ng unzip which xz
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and smoke the slot under the pinned Node
        run: |
          set -euo pipefail
          pnpm build:orcad-prebuilds
          [ "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)" = "$SLOT" ]
          pnpm build:orcad-prebuilds --require-slots "$SLOT"
          pnpm build:orcad-prebuilds --smoke
      - name: Stage the slot with its commit and checksums
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          [ "$head" = "$HEAD_SHA" ] || { echo "::error::checked out $head, not $HEAD_SHA"; exit 1; }
          node config/scripts/pod-orcad-template-provenance.mjs stage-lane out/orcad-prebuilds out/pod-orcad-lane "$head"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-orcad-lane-${{ matrix.slot }}
          path: out/pod-orcad-lane/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          # A rerun attempt re-uploads under the same name.
          overwrite: true

  musl:
    name: Slot ${{ matrix.slot }}
    needs: target
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slot: linux-x64-musl
          - os: ubuntu-24.04-arm
            slot: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SLOT: ${{ matrix.slot }}
      HEAD_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - name: Build, smoke and stage the slot on Alpine
        run: |
          set -euo pipefail
          # Multi-arch index digest of the tag; re-resolve it whenever NODE_RUNTIME_PIN moves.
          docker run --rm --init -i \
            -e ORCA_BACKGROUND_LAUNCH=1 -e SLOT -e HEAD_SHA \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1 sh -s <<'POD_MUSL_SLOT'
          set -eu
          apk add --no-cache bash git libstdc++ python3 make g++
          git config --global --add safe.directory /work
          head=$(git rev-parse HEAD)
          [ "$head" = "$HEAD_SHA" ] || { echo "checked out $head, not $HEAD_SHA" >&2; exit 1; }
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build:orcad-prebuilds
          [ "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)" = "$SLOT" ]
          pnpm build:orcad-prebuilds --require-slots "$SLOT"
          pnpm build:orcad-prebuilds --smoke
          node config/scripts/pod-orcad-template-provenance.mjs stage-lane out/orcad-prebuilds out/pod-orcad-lane "$head"
          POD_MUSL_SLOT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-orcad-lane-${{ matrix.slot }}
          path: out/pod-orcad-lane/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  darwin:
    name: Slot ${{ matrix.slot }}
    needs: target
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            slot: darwin-arm64
          - os: macos-15-intel
            slot: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      SLOT: ${{ matrix.slot }}
      HEAD_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and smoke the slot under the pinned Node
        run: |
          set -euo pipefail
          pnpm build:orcad-prebuilds
          [ "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)" = "$SLOT" ]
          pnpm build:orcad-prebuilds --require-slots "$SLOT"
          pnpm build:orcad-prebuilds --smoke
      - name: Stage the slot with its commit and checksums
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          [ "$head" = "$HEAD_SHA" ] || { echo "::error::checked out $head, not $HEAD_SHA"; exit 1; }
          node config/scripts/pod-orcad-template-provenance.mjs stage-lane out/orcad-prebuilds out/pod-orcad-lane "$head"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-orcad-lane-${{ matrix.slot }}
          path: out/pod-orcad-lane/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  template:
    name: Merge the template
    needs: [target, glibc, musl, darwin]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      HEAD_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Collect every lane's slot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pod-orcad-lane-*
          path: ${{ runner.temp }}/lanes
      - name: Check the lanes, merge them and build the template
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          [ "$head" = "$HEAD_SHA" ] || { echo "::error::checked out $head, not $HEAD_SHA"; exit 1; }
          provenance=config/scripts/pod-orcad-template-provenance.mjs
          targets=$(node "$provenance" targets)
          # Every lane: built from this commit, and the bytes it uploaded.
          node "$provenance" check-lanes "$RUNNER_TEMP/lanes" "$head" "$targets"
          node config/scripts/merge-orcad-prebuilds.mjs "$RUNNER_TEMP"/lanes/*/prebuilds
          pnpm build:orcad-prebuilds --require-slots "$targets"
          pnpm build:orcad-template --targets "$targets"
          node "$provenance" stage-template out/orcad-template "$RUNNER_TEMP/pod-orcad-template" "$head" "$GITHUB_RUN_ID"
          node "$provenance" check-template "$RUNNER_TEMP/pod-orcad-template" "$head" "$GITHUB_RUN_ID"
      - name: Report the template size
        run: |
          {
            echo '### orcad template'
            echo '```'
            du -sh out/orcad-template
            du -sh out/orcad-template/targets/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pod-orcad-template
          path: ${{ runner.temp }}/pod-orcad-template/
          # The per-target .server-target and .runtime-node markers are dotfiles.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true
