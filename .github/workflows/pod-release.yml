# Release workflow for the downstream product described by product/identity.json (Pod).
# Push a tag v0.<minor>.<patch> to build an arm64 DMG + zip, sign them with Developer ID, notarize and
# staple them, and publish a GitHub release (with latest-mac.yml for the in-app updater) in the
# identity's update-feed repo. All steps live in product/release.sh so a local release matches.
#
# Secrets (set in the repo that runs this workflow; see product/RELEASING.md):
#   CSC_LINK                base64 of the exported "Developer ID Application" certificate + key (.p12)
#   CSC_KEY_PASSWORD        password of that .p12
#   POD_SIGN_IDENTITY       e.g. "Developer ID Application: OUTOFPLACE POLAND SP. Z O.O (TEAMID)"
#   Notarization, either the App Store Connect API key (preferred):
#     APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER
#   or an Apple ID:
#     APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   POD_RELEASE_TOKEN       only if the release repo differs from this one (contents: write there)
name: Pod release

on:
  push:
    # Why v0.* only: this fork also carries Orca's ~1100 v1.x tags, and a `git push --tags` from a
    # clone holding new ones must not start a release per tag. Revisit before Pod 1.0.
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (v<semver>), must already exist'
        required: true

permissions:
  contents: write

concurrency:
  group: pod-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-mac:
    # Why this runner: Apple Silicon, with an Xcode whose Swift still uses per-triple build dirs.
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $TAG is not v<semver>"; exit 1; }

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/pod-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build, sign, notarize and publish
        env:
          POD_SIGN_IDENTITY: ${{ secrets.POD_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.POD_RELEASE_TOKEN || github.token }}
        run: product/release.sh "${TAG#v}" --publish

      - name: Keep the artifacts on the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pod-${{ env.TAG }}-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
          if-no-files-found: ignore

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/pod-signing.keychain-db" || true
